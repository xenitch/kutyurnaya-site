<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css?v=20261104b">
  <title>Тест формы — Кутюрная</title>
</head>
<body>
  <header class="site-header">
    <p class="site-name"><a href="/">Сообщество «Кутюрная»</a></p>
    <p class="site-tagline">Тестовая страница формы регистрации · не для публикации</p>
  </header>
  <main>
    <section class="note" id="register">
      <p class="kicker">Регистрация</p>
      <h2>Тестовая регистрация</h2>
      <form class="reg-form" method="post" action="/api/register.php">
        <input type="hidden" name="event" value="test">
        <label>Имя<input name="name" required maxlength="100" autocomplete="name"></label>
        <label>Номер телефона<input name="phone" type="tel" required autocomplete="tel" placeholder="+7 900 000-00-00"></label>
        <label>Почта<span class="hint">сюда придёт билет</span><input name="email" type="email" required maxlength="150" autocomplete="email"></label>
        <label>Телеграм<span class="hint">если нет, оставьте пустым</span><input name="telegram" maxlength="64" placeholder="@ник"></label>
        <label class="hp" aria-hidden="true">Сайт<input name="website" tabindex="-1" autocomplete="off"></label>
        <label class="consent"><input type="checkbox" name="consent" required> <span>Даю <a href="/soglasie/" target="_blank">согласие на&nbsp;обработку персональных данных</a> и&nbsp;подтверждаю, что ознакомлен(-а) с&nbsp;<a href="/privacy/" target="_blank">политикой обработки персональных данных</a></span></label>
        <button type="submit">Зарегистрироваться и&nbsp;оплатить</button>
      </form>
    </section>
  </main>
</body>
</html>
